name: 🤖 Gerar Artigo no Blog

on:
  schedule:
    # Todo dia às 09:00 horário de Brasília (12:00 UTC)
    - cron: '0 12 * * *'

  # Permite rodar manualmente
  workflow_dispatch:
    inputs:
      count:
        description: 'Quantos artigos gerar?'
        required: false
        default: '1'

jobs:
  generate-post:
    name: Gerar e publicar artigo
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar artigo via Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          node generate-posts.js --count 1

      - name: Commit e push
        run: |
          git config --local user.email "bot@digify.live"
          git config --local user.name "Digify Blog Bot"
          git add blog/ index.html
          git diff --staged --quiet || git commit -m "✍️ Blog: novo artigo [$(date '+%d/%m/%Y')]"
          git pull --rebase origin main
          git push
