name: 🤖 Gerar Artigo no Blog

on:
  schedule:
    # Todo dia às 09:00 de Brasília (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Quantos artigos gerar?'
        required: false
        default: '1'

concurrency:
  group: blog-generation
  cancel-in-progress: false

jobs:
  generate-post:
    name: Gerar, renderizar e publicar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # NOVO — o build.py é quem renderiza o site inteiro
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar artigo via Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node generate-posts.js --count "${{ github.event.inputs.count || '1' }}"

      # NOVO — regenera as 14 páginas, todos os artigos, o sitemap e o RSS
      - name: Renderizar o site
        run: python3 _build/build.py

      - name: Commit e push
        run: |
          git config --local user.email "bot@digify.live"
          git config --local user.name "Digify Blog Bot"
          git add -A
          git diff --staged --quiet && echo "Nada a publicar." && exit 0
          git commit -m "✍️ Blog: novo artigo [$(date '+%d/%m/%Y')]"
          git pull --rebase origin main
          git push
